spring.application.name=ikigai-pivot-map
server.port=8080

# The page is served from static resources built by client/ (npm run build).
spring.web.resources.static-locations=classpath:/static/

# DeepSeek settings. The key comes from the environment, never from a file in the repo.
ikigai.deepseek.endpoint=https://api.deepseek.com/chat/completions
ikigai.deepseek.model=deepseek-chat

# Keep the log quiet about client disconnects during the model call.
logging.level.org.springframework.web=INFO
